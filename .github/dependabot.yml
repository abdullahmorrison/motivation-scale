version: 2

updates:
  # One entry per lockfile — Dependabot does not search the repo recursively.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(server)
    groups:
      # Roll all minor + patch bumps into a single weekly PR. Majors still get
      # their own PR, since those are the ones that need real review.
      server-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(website)
    groups:
      website-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(mobile)
    groups:
      mobile-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Keeps the actions in ci.yml (checkout, setup-node, ...) from going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
